<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#131314">
<title>GoVPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #131314;
  --text: #e3e3e3;
  --sidebar: #1e1f20;
  --content-bg: #131314;
  --border: #444746;
  --primary: #1a73e8;
  --active-item: #333537;
  --modal-bg: #1e1f20;
  --warning-gray: #70757a;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "Inter", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  max-width: 768px;
  margin: 0 auto;
  position: relative;
}

/* ─── Splash Screen ─── */
.splash {
  position: fixed;
  inset: 0;
  background: #131314;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  transition: opacity 0.5s ease;
}

.splash.hidden {
  opacity: 0;
  pointer-events: none;
}

.splash img {
  width: 140px;
  height: auto;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.splash img.visible {
  opacity: 0.9;
}

.app-container {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  height: 56px;
  flex-shrink: 0;
  z-index: 10;
}

.lock-icon {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lock-icon svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: #ff4d4d;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: #ff4d4d;
  letter-spacing: 0.3px;
}

.icon-btn {
  background: transparent;
  border: none;
  color: var(--warning-gray);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color 0.2s ease;
}

.icon-btn:hover {
  background: var(--active-item);
  color: var(--text);
}

.icon-btn svg {
  width: 22px;
  height: 22px;
}

/* ─── Network Banner ─── */
.network-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #ff4d4d;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  gap: 12px;
  flex-shrink: 0;
}

.network-banner.show {
  display: flex;
}

.network-banner span {
  flex: 1;
  line-height: 1.4;
}

.network-banner button {
  background: rgba(255,255,255,0.2);
  border: none;
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.2s ease;
}

.network-banner button:hover {
  background: rgba(255,255,255,0.35);
}

.content-main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
}

.content-main::-webkit-scrollbar {
  display: none;
}

.bottom-nav {
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 68px;
  padding: 8px 0 env(safe-area-inset-bottom, 8px);
  background: var(--sidebar);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: transparent;
  border: none;
  color: var(--warning-gray);
  cursor: pointer;
  padding: 4px 24px;
  transition: color 0.15s ease;
}

.nav-item svg {
  width: 26px;
  height: 26px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-item span {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2px;
}

.nav-item.active {
  color: var(--primary);
}

.nav-item.active span {
  color: var(--primary);
}

@media (min-width: 769px) {
  body {
    background: #0a0a0b;
  }
  .app-container {
    max-width: 420px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    min-height: 100dvh;
  }
}
</style>
</head>

<script>
(function() {
  // Splash screen
  var splash = document.getElementById('splash');
  var splashImg = splash.querySelector('img');

  setTimeout(function() {
    splashImg.classList.add('visible');
  }, 300);

  setTimeout(function() {
    splash.classList.add('hidden');
  }, 2800);

  // Network check
  var netBanner = document.getElementById('networkBanner');
  var netOk = document.getElementById('networkOkBtn');

  function checkNetwork() {
    if (navigator.onLine) {
      netBanner.classList.remove('show');
    } else {
      netBanner.classList.add('show');
    }
  }

  netOk.addEventListener('click', function() {
    netBanner.classList.remove('show');
  });

  window.addEventListener('online', function() {
    netBanner.classList.remove('show');
  });

  checkNetwork();
  setInterval(checkNetwork, 60000);

  const navItems = document.querySelectorAll('.nav-item');
  const topbarItems = document.querySelectorAll('.lock-icon, .topbar-title, .icon-btn');

  navItems.forEach(item => {
    item.addEventListener('click', function() {
      navItems.forEach(n => n.classList.remove('active'));
      this.classList.add('active');
      const show = this.dataset.tab === 'home';
      topbarItems.forEach(el => el.style.display = show ? '' : 'none');
    });
  });
})();
</script>
