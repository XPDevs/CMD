<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#131314">
<title>GoVPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #131314;
  --text: #e3e3e3;
  --sidebar: #1e1f20;
  --content-bg: #131314;
  --border: #444746;
  --primary: #1a73e8;
  --active-item: #333537;
  --modal-bg: #1e1f20;
  --warning-gray: #70757a;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "Inter", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  max-width: 768px;
  margin: 0 auto;
  position: relative;
}

.splash {
  position: fixed;
  inset: 0;
  background: #131314;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  transition: opacity 0.5s ease;
}

.splash.hidden {
  opacity: 0;
  pointer-events: none;
}

.splash svg {
  width: 100px;
  height: 100px;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.splash svg.visible {
  opacity: 0.9;
}

.app-container {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
  overflow: hidden;
}

.topbar {
  display: flex;
  flex-direction: column;
  padding: 12px 16px 0;
  flex-shrink: 0;
  z-index: 10;
}

.lock-icon {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lock-icon svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: #ff4d4d;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: #ff4d4d;
  letter-spacing: 0.3px;
}

.topbar-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--sidebar);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  margin: 0 auto;
}

.topbar-pill .pill-divider {
  color: var(--border);
  font-weight: 300;
}

.topbar-pill.na {
  color: var(--warning-gray);
}

.topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}

.topbar-bottom {
  display: flex;
  justify-content: center;
  padding: 0 16px 8px;
  width: 100%;
}

.icon-btn {
  background: transparent;
  border: none;
  color: var(--warning-gray);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color 0.2s ease;
}

.icon-btn:hover {
  background: var(--active-item);
  color: var(--text);
}

.icon-btn svg {
  width: 22px;
  height: 22px;
}

.network-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--sidebar);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  gap: 12px;
  flex-shrink: 0;
}

.network-banner.show {
  display: flex;
}

.network-banner span {
  flex: 1;
  line-height: 1.4;
}

.network-banner button {
  background: var(--primary);
  border: none;
  color: #fff;
  font-weight: 500;
  font-size: 13px;
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  flex-shrink: 0;
  transition: filter 0.2s ease;
}

.network-banner button:hover {
  filter: brightness(0.9);
}

.content-main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
}

.content-main::-webkit-scrollbar {
  display: none;
}

.tab-content {
  display: none;
  flex-direction: column;
  height: 100%;
}

.tab-content.active {
  display: flex;
}

.home-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 24px 16px;
  gap: 24px;
}

.home-content .conn-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--warning-gray);
}

.home-content .conn-info .conn-time {
  font-variant-numeric: tabular-nums;
}

.countries-content {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

.countries-content .search-wrap {
  padding: 12px 16px;
  flex-shrink: 0;
}

.countries-content .search-wrap input {
  width: 100%;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--sidebar);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
}

.countries-content .search-wrap input:focus {
  border-color: var(--primary);
}

.countries-content .server-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 16px;
  scrollbar-width: none;
}

.countries-content .server-list::-webkit-scrollbar { display: none; }

.countries-content .server-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 16px;
  margin-bottom: 4px;
}

.countries-content .server-item .flag {
  font-size: 24px;
  flex-shrink: 0;
}

.countries-content .server-item .server-info {
  flex: 1;
  min-width: 0;
}

.countries-content .server-item .server-info .name {
  font-size: 14px;
  font-weight: 500;
}

.countries-content .server-item .server-info .detail {
  font-size: 11px;
  color: var(--warning-gray);
  margin-top: 2px;
}

.countries-content .no-results {
  text-align: center;
  padding: 32px 16px;
  color: var(--warning-gray);
  font-size: 14px;
}

.settings-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  z-index: 10000;
  align-items: flex-end;
  justify-content: center;
}

.settings-overlay.show { display: flex; }

.settings-modal {
  background: var(--modal-bg);
  border-radius: 28px 28px 0 0;
  width: 100%;
  max-width: 768px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px 20px 32px;
  scrollbar-width: none;
}

.settings-modal::-webkit-scrollbar { display: none; }

.settings-modal .settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.settings-modal .settings-header h2 {
  font-size: 1.3rem;
  font-weight: 700;
}

.settings-modal .settings-header .close-btn {
  background: var(--active-item);
  border: none;
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.settings-modal .setting-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}

.settings-modal .setting-item:last-child {
  border-bottom: none;
}

.settings-modal .setting-item .setting-info { flex: 1; }

.settings-modal .setting-item .setting-info .label {
  font-size: 14px;
  font-weight: 500;
}

.settings-modal .setting-item .setting-info .desc {
  font-size: 12px;
  color: var(--warning-gray);
  margin-top: 2px;
}

.toggle {
  position: relative;
  display: inline-block;
  width: 48px;
  height: 24px;
  flex-shrink: 0;
}

.toggle input { opacity: 0; width: 0; height: 0; }

.toggle .slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: var(--border);
  border-radius: 24px;
  transition: .3s;
}

.toggle .slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: #fff;
  border-radius: 50%;
  transition: .3s;
}

.toggle input:checked + .slider { background-color: var(--primary); }
.toggle input:checked + .slider:before { transform: translateX(24px); }

.bottom-nav {
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 68px;
  padding: 8px 0 env(safe-area-inset-bottom, 8px);
  background: var(--sidebar);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: transparent;
  border: none;
  color: var(--warning-gray);
  cursor: pointer;
  padding: 4px 24px;
  transition: color 0.15s ease;
}

.nav-item svg {
  width: 26px;
  height: 26px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-item span {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2px;
}

.nav-item.active { color: var(--primary); }
.nav-item.active span { color: var(--primary); }

@media (min-width: 769px) {
  body { background: #0a0a0b; }
  .app-container {
    max-width: 420px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    min-height: 100dvh;
  }
}
</style>
</head>
<body>

<div class="splash" id="splash">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect x="25" y="45" width="50" height="35" rx="6" fill="none" stroke="#1a73e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M33 45V30a17 17 0 0 1 34 0v15" fill="none" stroke="#1a73e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="62" r="5" fill="#1a73e8"/>
    <text x="50" y="93" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#e3e3e3" letter-spacing="1">GoVPN</text>
  </svg>
</div>

<div class="app-container">
  <header class="topbar">
    <div class="topbar-row">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24">
          <rect class="lock-body" x="5" y="11" width="14" height="10" rx="2"/>
          <path class="lock-body" d="M8 11V7a4 4 0 0 1 7.5-2"/>
          <circle class="lock-inner" cx="12" cy="16" r="1" fill="#ff4d4d" stroke="none"/>
        </svg>
      </div>
      <span class="topbar-title">Unprotected</span>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
    <div class="topbar-bottom">
      <div class="topbar-pill na" id="locationPill">
        <span id="pillLocation">N/A</span>
        <span class="pill-divider">|</span>
        <span id="pillIp">N/A</span>
      </div>
    </div>
  </header>

  <div class="network-banner" id="networkBanner">
    <span>A network connection is required for GoVPN to work.</span>
    <button id="networkOkBtn">Ok</button>
  </div>

  <main class="content-main">
    <div class="tab-content active" id="tabHome">
      <div class="home-content">
        <div class="conn-info">
          <span class="conn-time" id="connTime"></span>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tabCountries">
      <div class="countries-content">
        <div class="search-wrap">
          <input type="text" id="serverSearch" placeholder="Search countries..." autocomplete="off">
        </div>
        <div class="server-list" id="serverList"></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home">
      <svg viewBox="0 0 24 24">
        <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/>
      </svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-tab="countries">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span>Countries</span>
    </button>
  </nav>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-modal">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="close-btn" id="settingsClose">&times;</button>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="label">Kill Switch</div>
        <div class="desc">Block internet if VPN drops</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="killSwitch">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="label">DNS Leak Protection</div>
        <div class="desc">Use GoVPN DNS servers</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="dnsProtection" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="label">Auto-Connect</div>
        <div class="desc">Connect on app start</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="autoConnect">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="label">Protocol</div>
        <div class="desc">WireGuard / OpenVPN</div>
      </div>
      <div style="font-size:13px;color:var(--warning-gray);">WireGuard</div>
    </div>
    <div class="setting-item">
      <div class="setting-info">
        <div class="label">App Version</div>
        <div class="desc">GoVPN 1.0.0</div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var splash = document.getElementById('splash');
  var splashSvg = splash.querySelector('svg');
  setTimeout(function() { splashSvg.classList.add('visible'); }, 300);
  setTimeout(function() { splash.classList.add('hidden'); }, 2800);

  var netBanner = document.getElementById('networkBanner');
  var netOk = document.getElementById('networkOkBtn');
  function showNetBanner() { if (!navigator.onLine) netBanner.classList.add('show'); }
  function hideNetBanner() { netBanner.classList.remove('show'); }
  netOk.addEventListener('click', hideNetBanner);
  window.addEventListener('online', hideNetBanner);
  setInterval(showNetBanner, 60000);

  var servers = [
    { code: 'US', name: 'United States', flag: '\u{1F1FA}\u{1F1F8}', ip: '45.32.108.36', protocol: 'WireGuard' },
    { code: 'GB', name: 'United Kingdom', flag: '\u{1F1EC}\u{1F1E7}', ip: '37.120.210.137', protocol: 'WireGuard' },
    { code: 'CA', name: 'Canada', flag: '\u{1F1E8}\u{1F1E6}', ip: '147.135.10.89', protocol: 'WireGuard' },
    { code: 'DE', name: 'Germany', flag: '\u{1F1E9}\u{1F1EA}', ip: '46.4.90.244', protocol: 'OpenVPN' },
    { code: 'FR', name: 'France', flag: '\u{1F1EB}\u{1F1F7}', ip: '51.15.242.17', protocol: 'WireGuard' },
    { code: 'NL', name: 'Netherlands', flag: '\u{1F1F3}\u{1F1F1}', ip: '45.32.108.36', protocol: 'WireGuard' },
    { code: 'JP', name: 'Japan', flag: '\u{1F1EF}\u{1F1F5}', ip: '45.76.114.126', protocol: 'OpenVPN' },
    { code: 'AU', name: 'Australia', flag: '\u{1F1E6}\u{1F1FA}', ip: '45.77.44.51', protocol: 'WireGuard' },
    { code: 'SG', name: 'Singapore', flag: '\u{1F1F8}\u{1F1EC}', ip: '139.162.123.108', protocol: 'WireGuard' },
    { code: 'BR', name: 'Brazil', flag: '\u{1F1E7}\u{1F1F7}', ip: '177.54.22.14', protocol: 'OpenVPN' },
    { code: 'IN', name: 'India', flag: '\u{1F1EE}\u{1F1F3}', ip: '139.59.33.25', protocol: 'WireGuard' },
    { code: 'SE', name: 'Sweden', flag: '\u{1F1F8}\u{1F1EA}', ip: '176.58.32.147', protocol: 'WireGuard' },
    { code: 'NO', name: 'Norway', flag: '\u{1F1F3}\u{1F1F4}', ip: '159.89.82.47', protocol: 'OpenVPN' },
    { code: 'CH', name: 'Switzerland', flag: '\u{1F1E8}\u{1F1ED}', ip: '159.89.82.47', protocol: 'WireGuard' },
    { code: 'ZA', name: 'South Africa', flag: '\u{1F1FF}\u{1F1E6}', ip: '159.89.82.47', protocol: 'WireGuard' },
  ];

  var serverList = document.getElementById('serverList');

  function renderServers(filter) {
    var html = '';
    var filtered = filter ? servers.filter(function(s) { return s.name.toLowerCase().includes(filter.toLowerCase()); }) : servers;
    if (filtered.length === 0) {
      html = '<div class="no-results">No servers found</div>';
    } else {
      filtered.forEach(function(s) {
        html += '<div class="server-item" data-code="' + s.code + '">' +
          '<span class="flag">' + s.flag + '</span>' +
          '<div class="server-info"><div class="name">' + s.name + '</div><div class="detail">' + s.protocol + ' \u2022 ' + s.ip + '</div></div>' +
          '</div>';
      });
    }
    serverList.innerHTML = html;
  }

  renderServers('');

  document.getElementById('serverSearch').addEventListener('input', function() {
    renderServers(this.value);
  });

  var navItems = document.querySelectorAll('.nav-item');
  var tabContents = document.querySelectorAll('.tab-content');
  var topbarItems = document.querySelectorAll('.lock-icon, .topbar-title, .icon-btn, .topbar-bottom');

  navItems.forEach(function(item) {
    item.addEventListener('click', function() {
      navItems.forEach(function(n) { n.classList.remove('active'); });
      this.classList.add('active');
      var tab = this.dataset.tab;
      tabContents.forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
      topbarItems.forEach(function(el) { el.style.display = tab === 'home' ? '' : 'none'; });
    });
  });

  var settingsOverlay = document.getElementById('settingsOverlay');
  var settingsBtn = document.getElementById('settingsBtn');
  var settingsClose = document.getElementById('settingsClose');

  settingsBtn.addEventListener('click', function() { settingsOverlay.classList.add('show'); });
  settingsClose.addEventListener('click', function() { settingsOverlay.classList.remove('show'); });
  settingsOverlay.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });
})();
</script>
</body>
</html>
