<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UNDERTALE Concert Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #131314;
  --text: #e3e3e3;
  --surface: #1e1f20;
  --border: #444746;
  --primary: #1a73e8;
  --active: #333537;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  -webkit-text-size-adjust: 100%;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}
header h1 {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
header h1 span { color: var(--primary); }
.load-btn {
  flex-shrink: 0;
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#videoWrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  min-height: 0;
  position: relative;
}
#mainVideo {
  width: 100%;
  height: 100%;
  max-height: 100%;
  object-fit: contain;
  background: #000;
  display: block;
}
#mainVideo.hidden { display: none; }
#placeholder {
  color: var(--border);
  font-size: 13px;
  text-align: center;
  padding: 20px;
  line-height: 1.6;
}
#placeholder strong { display: block; font-size: 15px; color: #888; }
.controls {
  flex-shrink: 0;
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
}
.toggle-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 11px;
  color: #a0a0a0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.toggle input { display: none; }
.toggle-knob {
  width: 32px;
  height: 18px;
  background: #333537;
  border-radius: 10px;
  position: relative;
  transition: .2s;
  flex-shrink: 0;
}
.toggle-knob::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  background: #71717a;
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: .2s;
}
.toggle input:checked + .toggle-knob { background: var(--primary); }
.toggle input:checked + .toggle-knob::after { background: #fff; transform: translateX(14px); }
.timeline-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #888;
  font-weight: 700;
}
.timeline-header span:last-child {
  font-size: 9px;
  background: var(--active);
  padding: 2px 8px;
  border-radius: 4px;
  color: #aaa;
  font-weight: 500;
  letter-spacing: 0;
}
#timestampList {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
  min-height: 0;
}
.track-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,.04);
  font-size: 13px;
  color: #a0a0a0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
  min-height: 40px;
}
.track-item:active { background: var(--active); }
.track-item.active {
  background: rgba(26,115,232,.12) !important;
  border-left: 3px solid var(--primary);
  color: #fff;
}
.track-item.active .track-time {
  background: var(--primary);
  color: #fff;
}
.track-item .track-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.3;
}
.track-item .track-time {
  flex-shrink: 0;
  font-size: 10px;
  font-family: monospace;
  background: rgba(0,0,0,.3);
  padding: 2px 6px;
  border-radius: 3px;
  color: #666;
}
.track-header-item {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--primary);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  position: sticky;
  top: 0;
  z-index: 2;
  cursor: default;
  min-height: 34px;
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>UNDERTALE <span>Concert</span></h1>
  <label class="load-btn">
    Load Video
    <input type="file" id="videoInput" class="hidden" accept="video/mp4" style="display:none">
  </label>
</header>

<div id="videoWrap">
  <video id="mainVideo" class="hidden" controls preload="metadata"></video>
  <div id="placeholder">
    <strong>No video loaded</strong>
    Tap "Load Video" to open a concert file
  </div>
</div>

<div class="controls">
  <div class="toggle-row">
    <label class="toggle">
      <input type="checkbox" id="autoSkip" checked>
      <span class="toggle-knob"></span>
      Skip Intermission
    </label>
    <label class="toggle">
      <input type="checkbox" id="autoStart" checked>
      <span class="toggle-knob"></span>
      Auto-Start
    </label>
  </div>
</div>

<div class="timeline-header">
  <span>Timeline</span>
  <span id="trackCount">0</span>
</div>

<div id="timestampList"></div>

const video = document.getElementById('mainVideo');
const videoInput = document.getElementById('videoInput');
const list = document.getElementById('timestampList');
const placeholder = document.getElementById('placeholder');
const autoSkip = document.getElementById('autoSkip');
const autoStart = document.getElementById('autoStart');

const CONCERT_START = 2875;
const INTER_START = 4834;
const INTER_END = 6076;

const KEY = 'undertale_concert';

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ autoSkip: autoSkip.checked, autoStart: autoStart.checked })); } catch {}
}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d) {
      if (d.autoSkip !== undefined) autoSkip.checked = d.autoSkip;
      if (d.autoStart !== undefined) autoStart.checked = d.autoStart;
    }
  } catch {}
}

function hms(s) {
  const p = s.split(':').map(Number);
  let r = 0, m = 1;
  while (p.length) { r += m * p.pop(); m *= 60; }
  return r;
}

function init() {
  const lines = rawTimestamps.split('\n');
  let count = 0;
  for (const line of lines) {
    const m = line.match(/^(\d+:\d+(?::\d+)?)\s*-\s*(.*)/);
    if (!m) continue;
    const time = hms(m[1]);
    const label = m[2];
    const isHeader = label.includes('--');
    const div = document.createElement('div');
    div.className = isHeader ? 'track-header-item' : 'track-item';
    if (!isHeader) {
      div.innerHTML = '<span class="track-label">' + label + '</span><span class="track-time">' + m[1] + '</span>';
      div.dataset.time = time;
      div.onclick = () => { video.currentTime = time; video.play(); };
    } else {
      div.textContent = label.replace(/--/g, '').trim();
    }
    list.appendChild(div);
    count++;
  }
  document.getElementById('trackCount').textContent = count;
}

videoInput.onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  video.src = URL.createObjectURL(f);
  video.classList.remove('hidden');
  placeholder.style.display = 'none';
  video.onloadedmetadata = () => {
    if (autoStart.checked) { video.currentTime = CONCERT_START; video.play(); }
  };
};

video.ontimeupdate = () => {
  const ct = video.currentTime;
  if (autoSkip.checked && ct >= INTER_START && ct < INTER_END) { video.currentTime = INTER_END; }
  const items = list.querySelectorAll('.track-item[data-time]');
  let found = false;
  for (let i = items.length - 1; i >= 0; i--) {
    const t = parseFloat(items[i].dataset.time);
    if (!found && ct >= t) {
      if (!items[i].classList.contains('active')) {
        items[i].classList.add('active');
        items[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      found = true;
    } else {
      items[i].classList.remove('active');
    }
  }
};

autoSkip.onchange = save;
autoStart.onchange = save;

window.onload = () => { load(); init(); };
</script>

</html>
