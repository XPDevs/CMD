<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brew & Co. — Premium Coffee</title>

    <!-- Favicon SVG (matches logo) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%23F7F1E3'/><circle cx='256' cy='256' r='196' fill='%232E241B'/><circle cx='256' cy='256' r='164' fill='%23BC6537'/><ellipse cx='256' cy='286' rx='112' ry='86' fill='%23F7F1E3'/><path d='M368 262c34-4 58 14 54 40-4 28-38 44-74 36' fill='none' stroke='%23F7F1E3' stroke-width='22' stroke-linecap='round'/><ellipse cx='256' cy='278' rx='84' ry='60' fill='%235A4632'/><path d='M212 150c-12-20 12-30 2-50m42 52c-12-22 12-32 2-54m42 56c-12-22 12-32 2-54' fill='none' stroke='%232E241B' stroke-width='16' stroke-linecap='round'/></svg>" />

    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #F7F1E3;
            color: #2E241B;
            line-height: 1.6;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        button {
            cursor: pointer;
            font: inherit;
        }
        input,
        textarea,
        select {
            font: inherit;
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* ── Theme Variables (Light only) ── */
        :root {
            --background: #F7F1E3;
            --foreground: #2E241B;
            --card: #FBF7EC;
            --card-foreground: #2E241B;
            --popover: #FFFFFF;
            --popover-foreground: #2E241B;
            --primary: #BC6537;
            --primary-foreground: #FFFFFF;
            --primary-light: #D9895A;
            --secondary: #EAE0CB;
            --secondary-foreground: #5A4632;
            --muted: #E4D9BF;
            --muted-foreground: #8A8070;
            --accent: #EAE0CB;
            --accent-foreground: #2E241B;
            --destructive: #C0392B;
            --border: #D3C5A4;
            --input: #D3C5A4;
            --ring: #BC6537;
            --radius: 0.5rem;
            --shadow-card: 0 8px 30px rgba(46, 36, 27, 0.08);
            --shadow-lg: 0 20px 60px rgba(46, 36, 27, 0.12);
            --transition-smooth: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ── Utility ── */
        .bg-background {
            background: var(--background);
        }
        .text-foreground {
            color: var(--foreground);
        }
        .text-muted {
            color: var(--muted-foreground);
        }
        .border-theme {
            border-color: var(--border);
        }
        .bg-card {
            background: var(--card);
        }
        .text-card {
            color: var(--card-foreground);
        }
        .bg-primary {
            background: var(--primary);
        }
        .text-primary {
            color: var(--primary);
        }
        .bg-primary-foreground {
            background: var(--primary-foreground);
        }
        .text-primary-foreground {
            color: var(--primary-foreground);
        }
        .bg-secondary {
            background: var(--secondary);
        }
        .text-secondary-foreground {
            color: var(--secondary-foreground);
        }
        .bg-accent {
            background: var(--accent);
        }
        .text-accent-foreground {
            color: var(--accent-foreground);
        }
        .bg-destructive {
            background: var(--destructive);
        }
        .text-destructive-foreground {
            color: #fff;
        }
        .rounded-theme {
            border-radius: var(--radius);
        }
        .border-theme {
            border: 1px solid var(--border);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* ── Animations ── */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease forwards;
        }
        .animate-fade-up {
            animation: fadeInUp 0.5s ease forwards;
        }
        .animate-scale {
            animation: scaleIn 0.35s ease forwards;
        }
        .animate-slide-right {
            animation: slideInRight 0.35s ease forwards;
        }

        .stagger>*:nth-child(1) {
            animation-delay: 0.03s;
        }
        .stagger>*:nth-child(2) {
            animation-delay: 0.06s;
        }
        .stagger>*:nth-child(3) {
            animation-delay: 0.09s;
        }
        .stagger>*:nth-child(4) {
            animation-delay: 0.12s;
        }
        .stagger>*:nth-child(5) {
            animation-delay: 0.15s;
        }
        .stagger>*:nth-child(6) {
            animation-delay: 0.18s;
        }
        .stagger>*:nth-child(7) {
            animation-delay: 0.21s;
        }
        .stagger>*:nth-child(8) {
            animation-delay: 0.24s;
        }
        .stagger>*:nth-child(9) {
            animation-delay: 0.27s;
        }
        .stagger>*:nth-child(10) {
            animation-delay: 0.30s;
        }

        /* ── Layout ── */
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--background);
            color: var(--foreground);
        }

        /* ── Header / Nav ── */
        .header {
            border-bottom: 1px solid var(--border);
            background: rgba(247, 241, 227, 0.92);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 50;
            transition: border-color 0.3s;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 4.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            background: none;
            border: none;
            color: var(--foreground);
            cursor: pointer;
            padding: 0;
        }
        .logo svg {
            width: 2.4rem;
            height: 2.4rem;
            flex-shrink: 0;
        }
        .logo span {
            color: var(--primary);
        }
        .logo .co {
            color: var(--foreground);
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 0.25rem;
            align-items: center;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links button {
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            background: transparent;
            border: none;
            color: var(--foreground);
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-links button:hover {
            background: var(--accent);
        }
        .nav-links button.active {
            background: var(--primary);
            color: var(--primary-foreground);
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .lang-currency {
            display: flex;
            gap: 0.25rem;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.1rem 0.3rem;
        }
        .lang-currency select {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            padding: 0.2rem 0.1rem;
            color: var(--foreground);
            cursor: pointer;
            outline: none;
        }
        .lang-currency select option {
            background: var(--card);
        }
        .cart-btn {
            position: relative;
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--foreground);
            font-weight: 500;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: background 0.2s;
            cursor: pointer;
        }
        .cart-btn:hover {
            background: var(--accent);
        }
        .cart-badge {
            background: var(--primary);
            color: var(--primary-foreground);
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.1rem 0.45rem;
            border-radius: 9999px;
            margin-left: 0.15rem;
        }
        .account-btn {
            padding: 0.4rem 0.6rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--foreground);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: background 0.2s;
            cursor: pointer;
        }
        .account-btn:hover {
            background: var(--accent);
        }
        .account-btn .avatar {
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 9999px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--foreground);
            cursor: pointer;
        }

        /* ── Main ── */
        .main {
            flex: 1;
            padding: 2.5rem 0;
        }
        .page {
            animation: fadeInUp 0.4s ease forwards;
        }

        /* ── Hero ── */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
            padding: 2rem 0 3rem;
        }
        .hero-content h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 1rem;
        }
        .hero-content h1 span {
            color: var(--primary);
        }
        .hero-content p {
            font-size: 1.125rem;
            color: var(--muted-foreground);
            max-width: 480px;
            margin-bottom: 1.5rem;
        }
        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero-image svg {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(46, 36, 27, 0.06));
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            transition: all 0.25s ease;
            background: var(--primary);
            color: var(--primary-foreground);
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.88;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(188, 101, 55, 0.2);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--foreground);
        }
        .btn-outline:hover {
            background: var(--accent);
            box-shadow: none;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: var(--secondary);
            color: var(--secondary-foreground);
        }
        .btn-secondary:hover {
            background: #d5c9b0;
        }
        .btn-sm {
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .btn-danger {
            background: var(--destructive);
            color: #fff;
        }
        .btn-danger:hover {
            background: #a93226;
        }

        /* ── Section ── */
        .section {
            padding: 3rem 0;
        }
        .section-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .section-header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .section-header p {
            color: var(--muted-foreground);
            max-width: 560px;
            margin: 0.5rem auto 0;
        }

        /* ── Product Grid ── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .product-card .image {
            display: flex;
            justify-content: center;
            padding: 0.5rem 0;
            background: var(--background);
            border-radius: var(--radius);
            transition: transform 0.3s ease;
        }
        .product-card:hover .image {
            transform: scale(1.02);
        }
        .product-card .image svg {
            width: 100%;
            max-height: 140px;
            object-fit: contain;
        }
        .product-card h3 {
            font-weight: 600;
            font-size: 1.05rem;
        }
        .product-card .category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted-foreground);
        }
        .product-card .price {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
        }
        .product-card .actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }
        .product-card .actions button {
            flex: 1;
            padding: 0.5rem;
            border-radius: var(--radius);
            border: none;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            background: var(--primary);
            color: var(--primary-foreground);
            cursor: pointer;
        }
        .product-card .actions button.outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--foreground);
        }
        .product-card .actions button.outline:hover {
            background: var(--accent);
        }
        .product-card .actions button:hover {
            opacity: 0.85;
            transform: scale(0.97);
        }

        /* ── Categories filter ── */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .filter-bar button {
            padding: 0.4rem 1.2rem;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--foreground);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .filter-bar button.active {
            background: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
        }
        .filter-bar button:hover:not(.active) {
            background: var(--accent);
        }

        /* ── Detail page ── */
        .detail-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            align-items: start;
        }
        .detail-image {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: box-shadow 0.3s ease;
        }
        .detail-image:hover {
            box-shadow: var(--shadow-lg);
        }
        .detail-image svg {
            max-width: 100%;
            max-height: 360px;
        }
        .detail-info h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .detail-info .price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0.5rem 0 1rem;
        }
        .detail-info .desc {
            color: var(--muted-foreground);
            margin-bottom: 1.5rem;
            line-height: 1.7;
        }
        .detail-info .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem 1.5rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--accent);
            border-radius: var(--radius);
        }
        .detail-info .specs dt {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .detail-info .specs dd {
            font-size: 0.85rem;
            color: var(--muted-foreground);
        }
        .detail-info .qty {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .detail-info .qty label {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .detail-info .qty input {
            width: 4rem;
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--background);
            color: var(--foreground);
        }
        .detail-info .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        /* ── About ── */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            align-items: center;
        }
        .about-text h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }
        .about-text p {
            color: var(--muted-foreground);
            margin-bottom: 1rem;
            line-height: 1.7;
        }
        .values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .values .item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .values .item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card);
        }
        .values .item h4 {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .values .item p {
            font-size: 0.85rem;
            color: var(--muted-foreground);
        }

        /* ── Account Pages ── */
        .auth-container {
            max-width: 420px;
            margin: 0 auto;
            padding: 1rem 0;
        }
        .auth-container .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow-card);
        }
        .auth-container .auth-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .auth-container .auth-card p {
            color: var(--muted-foreground);
            margin-bottom: 1.5rem;
        }
        .auth-container .auth-card label {
            font-weight: 500;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 0.25rem;
        }
        .auth-container .auth-card input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--background);
            color: var(--foreground);
            margin-bottom: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-container .auth-card input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(188, 101, 55, 0.15);
        }
        .auth-container .auth-card .form-row {
            display: flex;
            gap: 0.75rem;
        }
        .auth-container .auth-card .form-row>* {
            flex: 1;
        }
        .auth-container .auth-toggle {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--muted-foreground);
        }
        .auth-container .auth-toggle button {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
        }
        .auth-container .auth-toggle button:hover {
            text-decoration: underline;
        }

        /* Account Dashboard */
        .account-dashboard {
            max-width: 800px;
            margin: 0 auto;
        }
        .account-dashboard .account-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.5rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }
        .account-dashboard .account-header .avatar-lg {
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .account-dashboard .account-header .info h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .account-dashboard .account-header .info p {
            color: var(--muted-foreground);
        }
        .account-dashboard .account-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .account-dashboard .account-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
        }
        .account-dashboard .account-card h3 {

            border-bottom: 1px solid var(--border);

        .account-dashboard .account-card .order-item:last-child {
            border-bottom: none;
        }
        .account-dashboard .account-card .order-item .status {
            color: var(--primary);
            font-weight: 500;
        }

        /* ── Contact ── */

            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;

            flex-direction: column;
            gap: 1rem;

        .contact-form label {

            font-size: 0.9rem;

            background: var(--background);
            color: var(--foreground);
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .contact-form input:focus,
        .contact-form textarea:focus,
        .contact-form select:focus {

            box-shadow: 0 0 0 3px rgba(188, 101, 55, 0.15);

        .contact-form textarea {

            gap: 1.5rem;

            align-items: flex-start;

        .contact-info .item svg {

            font-weight: 600;
        }
        .contact-info .item p {
            color: var(--muted-foreground);
            font-size: 0.95rem;

        .blog-grid {

            gap: 1.5rem;

        .blog-card {
            background: var(--card);
            border: 1px solid var(--border);

        .blog-card h3 {

        /* Blog Detail */

            letter-spacing: -0.02em;
            margin: 0.5rem 0 0.75rem;
        }
        .blog-detail-header .tag {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: var(--accent);
            padding: 0.2rem 0.8rem;

        .blog-detail-body {
            max-width: 720px;
        }
        .blog-detail-body p {
            color: var(--muted-foreground);

        }
        .blog-detail-body h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 1.5rem 0 0.75rem;
        }
        .blog-detail-body ul {
            color: var(--muted-foreground);
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .blog-detail-body ul li {
            margin-bottom: 0.3rem;
        }

        /* ── FAQ ── */
        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 720px;
            margin: 0 auto;
        }
        .faq-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;

            transition: border-color 0.2s, box-shadow 0.2s;

        .faq-item:hover {

        .faq-item .q {

            max-height: 300px;
            padding-top: 0.75rem;

        /* ── Subscriptions ── */
        .sub-plans {

            border: 1px solid var(--border);

            font-size: 1.15rem;

        .sub-plan .sub-price {

            font-weight: 700;

            font-size: 0.9rem;

        /* ── Policy pages ── */
        .policy-content {

            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;

        .policy-content h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 1.5rem 0 0.5rem;
        }
        .policy-content p {
            color: var(--muted-foreground);
            line-height: 1.8;
            margin-bottom: 1rem;

        .policy-content ul {

            margin-bottom: 1rem;

            cursor: pointer;
            padding: 0;

        .footer ul button:hover {

        .footer ul a {

            font-size: 0.9rem;
            transition: color 0.2s;

        .footer ul a:hover {
            color: var(--primary);

        .footer-bottom {

            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--muted-foreground);

        .footer-social {
            display: flex;
            gap: 0.75rem;

        .footer-social a {
            color: var(--muted-foreground);
            transition: color 0.2s;
        }
        .footer-social a:hover {
            color: var(--primary);
        }

        .payment-icons {

        .payment-icons .payment-icon {

            border: 1px solid var(--border);
            border-radius: var(--radius);

            align-items: center;
            gap: 0.3rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--muted-foreground);
            transition: border-color 0.2s;
            height: 2rem;
        }
        .payment-icons .payment-icon:hover {
            border-color: var(--primary);
        }
        .payment-icons .payment-icon svg {
            width: 1.4rem;
            height: 1.4rem;
        }
        .payment-icons .payment-icon .label {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--foreground);

        .payment-icons .payment-icon .label small {
            font-weight: 400;
            font-size: 0.5rem;
        }

        .payment-text {
            text-align: center;
            font-size: 0.7rem;
            color: var(--muted-foreground);
            margin-top: 0.5rem;
        }

        /* ── Cart Sidebar ── */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(46, 36, 27, 0.4);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 420px;
            max-width: 90vw;
            height: 100%;
            background: var(--card);
            border-left: 1px solid var(--border);
            z-index: 101;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
        }
        .cart-sidebar.open {
            transform: translateX(0);
        }
        .cart-sidebar .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .cart-sidebar .head h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .cart-sidebar .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--foreground);
            padding: 0.25rem;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .cart-sidebar .close-btn:hover {
            transform: rotate(90deg);
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-right: 0.25rem;
        }
        .cart-items::-webkit-scrollbar {
            width: 4px;
        }
        .cart-items::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 9999px;
        }
        .cart-item {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
        }
        .cart-item .info {
            flex: 1;
        }
        .cart-item .info h4 {
            font-weight: 500;
            font-size: 0.95rem;
        }
        .cart-item .info .price {
            font-size: 0.85rem;
            color: var(--primary);
        }
        .cart-item .remove {
            background: none;
            border: none;
            color: var(--muted-foreground);
            font-size: 1rem;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius);
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
        }
        .cart-item .remove:hover {
            background: var(--destructive);
            color: #fff;
        }
        .cart-total {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.1rem;

            padding: 2rem 0;

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(46, 36, 27, 0.5);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);

            width: 92%;
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95) translateY(10px);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);

            overflow-y: auto;

        .modal-overlay.open .modal-card {
            transform: scale(1) translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .modal-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--muted-foreground);
            transition: transform 0.2s;
            padding: 0.25rem;
            cursor: pointer;
        }
        .modal-close-btn:hover {
            transform: rotate(90deg);
            color: var(--foreground);
        }
        .modal-body p {
            color: var(--muted-foreground);
            line-height: 1.7;
            margin-bottom: 1rem;
        }
        .modal-body .btn {
            margin-top: 0.5rem;
        }
        .modal-body .cart-summary-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }
        .modal-body .cart-summary-total {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-content p {
                margin-left: auto;
                margin-right: auto;
            }
            .about-grid {
                grid-template-columns: 1fr;
            }
            .contact-grid {
                grid-template-columns: 1fr;
            }
            .detail-layout {
                grid-template-columns: 1fr;
            }
            .footer-grid {
                grid-template-columns: 1fr 1fr;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 4.5rem;
                left: 0;
                right: 0;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                padding: 0.5rem 1.5rem;
                gap: 0.25rem;
                box-shadow: var(--shadow-card);
            }
            .nav-links.open {
                display: flex;
            }
            .mobile-menu-btn {
                display: block;
            }
            .nav-actions .cart-btn span.label {
                display: none;
            }
            .lang-currency select {
                font-size: 0.7rem;
                padding: 0.1rem 0.1rem;
            }
            .account-dashboard .account-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 600px) {
            .footer-grid {
                grid-template-columns: 1fr;
            }
            .values {
                grid-template-columns: 1fr;
            }
            .product-grid {
                grid-template-columns: 1fr 1fr;
            }
            .newsletter form {
                flex-direction: column;
            }
            .hero-content h1 {
                font-size: 2.25rem;
            }
            .section-header h2 {
                font-size: 1.5rem;
            }
            .detail-info .specs {
                grid-template-columns: 1fr;
            }
            .cart-sidebar {
                width: 100vw;
                max-width: 100vw;
                border-left: none;
            }
            .blog-grid {
                grid-template-columns: 1fr;
            }
            .header-inner {
                height: auto;
                padding: 0.5rem 0;
            }
            .nav-actions .lang-currency {
                order: 10;
                width: 100%;
                justify-content: center;
                margin-top: 0.25rem;
            }
            .auth-container .auth-card .form-row {
                flex-direction: column;
            }
            .payment-icons .payment-icon {
                padding: 0.2rem 0.4rem;
                font-size: 0.55rem;
                height: 1.6rem;
            }
            .payment-icons .payment-icon svg {
                width: 1rem;
                height: 1rem;
            }
        }
        @media (max-width: 420px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                `;
                    } else {
                        // Dashboard
                        const orders = state.user.orders || [];
                        pageContent = `
                  <div class="page">
                    <div class="account-dashboard">
                      <div class="account-header">
                        <div class="avatar-lg">${state.user.name.charAt(0).toUpperCase()}</div>
                        <div class="info">
                          <h2>${state.user.name}</h2>
                          <p>${state.user.email}</p>
                          <p style="font-size:0.8rem;color:var(--muted-foreground);">📍 ${t.ukAddress}</p>
                        </div>
                        <div style="margin-left:auto;">
                          <button class="btn btn-sm btn-danger" data-action="logout">${t.account.logout}</button>
                        </div>
                      </div>
                      <div class="account-grid">
                        <div class="account-card">
                          <h3>${t.account.orders}</h3>
                          ${orders.length === 0 ? `<p>${t.account.noOrders}</p>` : orders.map(o => `
                            <div class="order-item">
                              <span>#${o.id} — ${o.date}</span>
                              <span class="status">${o.status}</span>
                            </div>
                          `).join('')}
                          <button class="btn btn-sm btn-outline" style="margin-top:0.5rem;width:100%;">${t.account.orders}</button>
                        </div>
                        <div class="account-card">
                          <h3>${t.account.addresses}</h3>
                          <p>142 Coffee Lane<br/>London, UK</p>
                          <button class="btn btn-sm btn-outline" style="margin-top:0.5rem;width:100%;">Manage Addresses</button>
                        </div>
                        <div class="account-card">
                          <h3>${t.account.settings}</h3>
                          <p>Preferences, notifications, and profile settings.</p>
                          <button class="btn btn-sm btn-outline" style="margin-top:0.5rem;width:100%;">Edit Profile</button>
                        </div>
                        <div class="account-card">
                          <h3>Payment Methods</h3>
                          <p>Visa •••• 4242<br/>PayPal •••• user@email.com</p>
                          <button class="btn btn-sm btn-outline" style="margin-top:0.5rem;width:100%;">Manage Payments</button>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
                    }
                }

                // ─── POLICY PAGES ──────────────────────────────────────
                const policyPages = ['shipping', 'returns', 'privacy', 'terms'];
                if (policyPages.includes(state.page)) {
                    const policyData = {
                        shipping: {
                            title: 'Shipping Policy',
                            content: `
                    <p>At Brew & Co., we want to ensure your coffee arrives fresh and on time. Please review our shipping policy below.</p>
                    <h2>Processing Time</h2><p>Orders are processed within 1-2 business days (Monday–Friday). We do not ship on weekends or holidays. You will receive a confirmation email with tracking information once your order has shipped.</p>
                    <h2>Shipping Rates & Delivery</h2><p>We offer standard and expedited shipping options. Rates are calculated at checkout based on weight and destination.</p>
                    <ul><li><strong>Standard Shipping:</strong> 3-7 business days</li><li><strong>Expedited Shipping:</strong> 1-3 business days</li><li><strong>Free Standard Shipping:</strong> On orders over $50 (domestic only)</li></ul>
                    <h2>International Shipping</h2><p>We currently ship to the United States, Canada, and the United Kingdom. International shipping times vary by destination and customs processing.</p>
                    <h2>Order Tracking</h2><p>Once your order ships, you will receive a tracking number via email. Please allow up to 24 hours for tracking information to update.</p>
                  `
                        },
                        returns: {
                            title: 'Returns & Exchanges',
                            content: `
                    <p>We want you to love your Brew & Co. coffee. If you're not completely satisfied, we offer a hassle-free return policy.</p>
                    <h2>Return Eligibility</h2><p>You may return unopened coffee products within 30 days of receipt for a full refund. We cannot accept returns on opened coffee or perishable items.</p>
                    <h2>How to Initiate a Return</h2><p>Contact us at hello@brewandco.com with your order number and reason for return. We will provide you with a return shipping label and instructions.</p>
                    <h2>Refund Process</h2><p>Once we receive your return, we will inspect the item and process your refund within 5-7 business days. Refunds will be issued to the original payment method.</p>
                    <h2>Exchanges</h2><p>If you received a defective or incorrect item, we will exchange it at no cost. Please contact us immediately to arrange the exchange.</p>
                  `
                        },
                        privacy: {
                            title: 'Privacy Policy',
                            content: `
                    <p>Brew & Co. respects your privacy and is committed to protecting your personal information. This policy explains how we collect, use, and safeguard your data.</p>
                    <h2>Information We Collect</h2><p>We collect information you provide directly, such as your name, email address, phone number, and payment details when you place an order or sign up for our newsletter.</p>
                    <h2>How We Use Your Information</h2><ul><li>To process and fulfill orders</li><li>To communicate with you about your order or account</li><li>To send promotional offers and updates (you may opt out at any time)</li><li>To improve our website and customer experience</li></ul>
                    <h2>Data Security</h2><p>We use industry-standard encryption and security measures to protect your personal information. However, no method of transmission over the internet is 100% secure.</p>
                    <h2>Sharing Your Information</h2><p>We do not sell, trade, or rent your personal information to third parties. We may share your information with service providers who assist us in operating our website and conducting business.</p>
                  `
                        },
                        terms: {
                            title: 'Terms of Service',
                            content: `
                    <p>By using the Brew & Co. website and placing an order, you agree to the following terms and conditions. Please read them carefully.</p>
                    <h2>General</h2><p>All content on this site, including text, images, and logos, is the property of Brew & Co. and may not be reproduced without permission.</p>
                    <h2>Products & Pricing</h2><p>We strive to provide accurate product descriptions and pricing. However, we reserve the right to correct any errors or omissions and to change prices without notice.</p>
                    <h2>Orders & Payment</h2><p>All orders are subject to acceptance and availability. We may refuse or cancel any order for any reason. Payment must be received in full before your order is processed.</p>
                    <h2>Shipping & Delivery</h2><p>We aim to ship orders within the stated processing times. However, we are not liable for delays caused by carriers or unforeseen events.</p>
                    <h2>Returns & Refunds</h2><p>Please refer to our Returns & Exchanges policy for information on returns and refunds.</p>
                    <h2>Limitation of Liability</h2><p>To the fullest extent permitted by law, Brew & Co. shall not be liable for any indirect, incidental, or consequential damages arising from the use of our products or website.</p>
                  `
                        }
                    };

                    const data = policyData[state.page];
                    if (data) {
                        pageContent = `
                  <div class="page">
                    <div class="policy-content">
                      <h1>${data.title}</h1>
                      ${data.content}
                    </div>
                  </div>
                `;
                    }
                }

                // ─── CART SIDEBAR ──────────────────────────────────────
                const cartItemsHtml = state.cart.length === 0 ?
                    `<div class="cart-empty">Your cart is empty.<br />Start exploring our coffee collection.</div>` :
                    state.cart.map(item => {
                        const prod = products.find(p => p.id === item.id);
                        return `
                    <div class="cart-item">
                      <div style="width:40px;height:40px;flex-shrink:0;">${prod ? (PRODUCT_SVGS[prod.svg] || PRODUCT_SVGS.bean) : PRODUCT_SVGS.bean}</div>
                      <div class="info">
                        <h4>${prod ? prod.name : item.id}</h4>
                        <div class="price">${formatPrice(item.price * item.qty)} × ${item.qty}</div>
                      </div>
                      <button class="remove" data-action="remove-cart" data-param="${item.id}">✕</button>
                    </div>
                  `;
                    }).join('');

                // ─── FULL HTML ──────────────────────────────────────────
                const nav = t.nav || translations.en.nav;
                const navItems = [
                    { key: 'home', label: nav.home },
                    { key: 'products', label: nav.shop },
                    { key: 'subscriptions', label: nav.subscribe },
                    { key: 'about', label: nav.about },
                    { key: 'blog', label: nav.blog },
                    { key: 'faq', label: nav.faq },
                    { key: 'contact', label: nav.contact },
                    { key: 'account', label: nav.account },
                ];

                const navButtons = navItems.map(item =>
                    `<li><button data-action="nav" data-param="${item.key}" class="${state.page === item.key || (item.key === 'products' && (state.page === 'detail' || state.page === 'products')) ? 'active' : ''}">${item.label}</button></li>`
                ).join('');

                const footerLinks = [
                    { label: 'Shipping Policy', key: 'shipping' },
                    { label: 'Returns', key: 'returns' },
                    { label: 'Privacy Policy', key: 'privacy' },
                    { label: 'Terms of Service', key: 'terms' },
                ];

                // Payment icons
                const paymentIconsHtml = Object.entries(PAYMENT_ICONS).map(([key, svg]) =>
                    `<div class="payment-icon">${svg}</div>`
                ).join('');

                const accountBtnHtml = state.user ?
                    `<button class="account-btn" data-action="nav" data-param="account"><span class="avatar">${state.user.name.charAt(0).toUpperCase()}</span> ${state.user.name.split(' ')[0]}</button>` :
                    `<button class="account-btn" data-action="nav" data-param="account">${ICONS.user} Sign In</button>`;

                root.innerHTML = `
              <div class="app">
                <header class="header">
                  <div class="container header-inner">
                    <button class="logo" data-action="nav" data-param="home">
                      ${LOGO_SVG}
                      <span>Brew</span> <span class="co">& Co.</span>
                    </button>
                    <ul class="nav-links ${state.mobileNav ? 'open' : ''}">
                      ${navButtons}
                    </ul>
                    <div class="nav-actions">
                      <div class="lang-currency">
                        <select id="language-select" data-action="change-language">
                          ${Object.keys(translations).map(l => `<option value="${l}" ${l === currentLanguage ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('')}
                        </select>
                        <select id="currency-select" data-action="change-currency">
                          ${Object.keys(currencies).map(c => `<option value="${c}" ${c === currentCurrency ? 'selected' : ''}>${c}</option>`).join('')}
                        </select>
                      </div>
                      ${accountBtnHtml}
                      <button class="cart-btn" data-action="toggle-cart">
                        ${ICONS.cart}
                        <span class="label">Cart</span>
                        ${cartCount > 0 ? `<span class="cart-badge">${cartCount}</span>` : ''}
                      </button>
                      <button class="mobile-menu-btn" data-action="toggle-mobile" aria-label="Menu">☰</button>
                    </div>
                  </div>
                </header>

                <main class="main">
                  <div class="container">
                    ${pageContent}
                  </div>
                </main>

                <footer class="footer">
                  <div class="container">
                    <div class="footer-grid">
                      <div class="footer-brand">
                        <div style="display:flex;align-items:center;gap:0.5rem;font-weight:700;font-size:1.1rem;">
                          ${LOGO_SVG}
                          <span>Brew & Co.</span>
                        </div>
                        <p>Specialty coffee for the discerning palate. Whole beans, instant, and accessories — crafted with care.</p>
                        <div class="uk-badge">${UK_FLAG_SVG} ${t.uk}</div>
                      </div>
                      <div>
                        <h4>Shop</h4>
                        <ul>
                          <li><button data-action="nav" data-param="products">Whole Beans</button></li>
                          <li><button data-action="nav" data-param="products">Instant</button></li>
                          <li><button data-action="nav" data-param="products">Pods</button></li>
                          <li><button data-action="nav" data-param="subscriptions">Subscriptions</button></li>
                        </ul>
                      </div>
                      <div>
                        <h4>Company</h4>
                        <ul>
                          <li><button data-action="nav" data-param="about">About Us</button></li>
                          <li><button data-action="nav" data-param="blog">Blog</button></li>
                          <li><button data-action="nav" data-param="faq">FAQ</button></li>
                          <li><button data-action="nav" data-param="contact">Contact</button></li>
                        </ul>
                      </div>
                      <div>
                        <h4>Support</h4>
                        <ul>
                          ${footerLinks.map(link => `<li><button data-action="nav" data-param="${link.key}">${link.label}</button></li>`).join('')}
                        </ul>
                      </div>
                    </div>

                    <!-- Payment Icons -->
                    <div style="border-top:1px solid var(--border);padding-top:1rem;margin-bottom:1rem;">
                      <p style="text-align:center;font-size:0.8rem;color:var(--muted-foreground);margin-bottom:0.5rem;">${t.payments}</p>
                      <div class="payment-icons">${paymentIconsHtml}</div>
                      <p class="payment-text">Visa · Mastercard · PayPal · Apple Pay · Google Pay · American Express · Discover · Stripe</p>
                    </div>

                    <div class="footer-bottom">
                      <span>&copy; 2026 Brew & Co. All rights reserved. — London, UK</span>
                      <div class="footer-social">
                        <a href="#" aria-label="Facebook">${ICONS.facebook}</a>
                        <a href="#" aria-label="Instagram">${ICONS.instagram}</a>
                        <a href="#" aria-label="Twitter">${ICONS.twitter}</a>
                        <a href="#" aria-label="YouTube">${ICONS.youtube}</a>
                      </div>
                    </div>
                  </div>
                </footer>

                <div class="cart-overlay ${state.isCartOpen ? 'open' : ''}" data-action="toggle-cart"></div>
                <div class="cart-sidebar ${state.isCartOpen ? 'open' : ''}">
                  <div class="head">
                    <h2>Your Cart</h2>
                    <button class="close-btn" data-action="toggle-cart">✕</button>
                  </div>
                  <div class="cart-items">${cartItemsHtml}</div>
                  ${state.cart.length > 0 ? `
                    <div class="cart-total"><span>Total</span><span>${formatPrice(cartTotal)}</span></div>
                    <button class="cart-checkout" data-action="checkout">Proceed to Checkout</button>
                  ` : ''}
                </div>
              </div>
            `;

                // ─── RE-BIND EVENTS ──────────────────────────────────────
                document.querySelector('[data-action="close-modal"]')?.addEventListener('click', closeModal);
                document.getElementById('modal-overlay')?.addEventListener('click', function(e) {
                    if (e.target === this) closeModal();
                });

                document.getElementById('currency-select')?.addEventListener('change', function() {
                    currentCurrency = this.value;
                    render();
                });
                document.getElementById('language-select')?.addEventListener('change', function() {
                    currentLanguage = this.value;
                    render();
                });

                // Auth form
                document.getElementById('auth-form')?.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const action = this.dataset.action;
                    const email = document.getElementById('auth-email')?.value;
                    const password = document.getElementById('auth-password')?.value;
                    const name = document.getElementById('auth-name')?.value;

                    if (action === 'register') {
                        if (!name || !email || !password) return;
                        state.user = { name, email, password, orders: [{ id: 'ORD-001', date: '2026-08-20', status: 'Delivered' }] };
                        openModal('Account Created! 🎉', `
                  <p>Welcome ${name}! Your account has been created successfully.</p>
                  <p style="font-size:0.9rem;color:var(--muted-foreground);">You can now track orders, save addresses, and enjoy faster checkout.</p>
                  <button class="btn" data-action="close-modal" style="margin-top:0.5rem;">Continue</button>
                `);
                        state.page = 'account';
                        render();
                    } else if (action === 'login') {
                        if (!email || !password) return;
                        // Demo login — accept any valid email/password
                        state.user = { name: 'Coffee Lover', email, password, orders: [{ id: 'ORD-001', date: '2026-08-20', status: 'Delivered' }, { id: 'ORD-002', date: '2026-08-15', status: 'Shipped' }] };
                        openModal('Welcome Back! ☕', `
                  <p>You've been signed in successfully.</p>
                  <p style="font-size:0.9rem;color:var(--muted-foreground);">Your orders and preferences are now available.</p>
                  <button class="btn" data-action="close-modal" style="margin-top:0.5rem;">Continue</button>
                `);
                        state.page = 'account';
                        render();
                    }
                });

                // Toggle auth mode
                document.querySelector('[data-action="toggle-auth"]')?.addEventListener('click', function() {
                    state.authMode = state.authMode === 'login' ? 'register' : 'login';
                    render();
                });

                // Logout
                document.querySelector('[data-action="logout"]')?.addEventListener('click', function() {
                    state.user = null;
                    state.page = 'home';
                    render();
                    openModal('Logged Out', `<p>You've been signed out successfully. See you soon!</p><button class="btn" data-action="close-modal">Close</button>`);
                });
            }

            // ─── PRODUCT CARD ──────────────────────────────────────────
            function productCard(p, formatPrice) {
                return `
              <div class="product-card">
                <div class="image">${PRODUCT_SVGS[p.svg] || PRODUCT_SVGS.bean}</div>
                <span class="category">${p.category}</span>
                <h3>${p.name}</h3>
                <div class="price">${formatPrice(p.price)}</div>
                <div class="actions">
                  <button data-action="view-detail" data-param="${p.id}">View Details</button>
                  <button class="outline" data-action="add-cart" data-param="${p.id}">Add</button>
                </div>
              </div>
            `;
            }

            // ─── BLOG CARD ──────────────────────────────────────────────
            function blogCard(post) {
                return `
              <div class="blog-card" data-action="view-blog" data-param="${post.id}">
                <div class="date">${post.date}</div>
                <h3>${post.title}</h3>
                <p>${post.excerpt}</p>
                <span class="tag">${post.tag}</span>
              </div>
            `;
            }

            // ─── EVENT HANDLING ─────────────────────────────────────────
            document.addEventListener('click', function(e) {
                const target = e.target.closest('[data-action]');
                if (!target) return;
                const action = target.dataset.action;
                const param = target.dataset.param || null;

                switch (action) {
                    case 'nav':
                        state.page = param;
                        state.selectedProduct = null;
                        state.selectedBlog = null;
                        state.mobileNav = false;
                        render();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        break;
                    case 'view-detail':
                        state.page = 'detail';
                        state.selectedProduct = param;
                        state.mobileNav = false;
                        render();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        break;
                    case 'view-blog':
                        state.page = 'blog';
                        state.selectedBlog = param;
                        state.mobileNav = false;
                        render();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        break;
                    case 'add-cart':
                        addToCart(param);
                        break;
                    case 'remove-cart':
                        removeFromCart(param);
                        break;
                    case 'toggle-cart':
                        state.isCartOpen = !state.isCartOpen;
                        render();
                        break;
                    case 'toggle-mobile':
                        state.mobileNav = !state.mobileNav;
                        render();
                        break;
                    case 'filter':
                        state.filterCategory = param;
                        render();
                        break;
                    case 'faq-toggle':
                        toggleFaq(param);
                        break;
                    case 'checkout':
                        handleCheckout();
                        break;
                    case 'close-modal':
                        closeModal();
                        break;
                    case 'toggle-auth':
                        state.authMode = state.authMode === 'login' ? 'register' : 'login';
                        render();
                        break;
                    case 'logout':
                        state.user = null;
                        state.page = 'home';
                        render();
                        openModal('Logged Out', `<p>You've been signed out successfully.</p><button class="btn" data-action="close-modal">Close</button>`);
                        break;
                    default:
                        break;
                }
            });

            document.addEventListener('submit', function(e) {
                const form = e.target;
                if (form.id === 'newsletter-form') {
                    e.preventDefault();
                    handleNewsletter(e);
                }
                if (form.id === 'contact-form') {
                    e.preventDefault();
                    handleContact(e);
                }
            });

            // ─── ACTION FUNCTIONS ──────────────────────────────────────
            function addToCart(productId) {
                const product = products.find(p => p.id === productId);
                if (!product) return;
                let qty = 1;
                const qtyInput = document.getElementById('detail-qty');
                if (qtyInput) qty = parseInt(qtyInput.value) || 1;
                qty = Math.max(1, Math.min(10, qty));
                const existing = state.cart.find(item => item.id === productId);
                if (existing) {
                    existing.qty = Math.min(10, existing.qty + qty);
                } else {
                    state.cart.push({ id: productId, price: product.price, qty });
                }
                render();
            }

            function removeFromCart(productId) {
                state.cart = state.cart.filter(item => item.id !== productId);
                render();
            }

            function toggleFaq(index) {
                const idx = parseInt(index);
                if (isNaN(idx)) return;
                const open = state.faqOpen.includes(idx);
                state.faqOpen = open ? state.faqOpen.filter(i => i !== idx) : [...state.faqOpen, idx];
                render();
            }

            function handleNewsletter(e) {
                const input = document.getElementById('newsletter-input');
                if (input && input.value) {
                    state.newsletterEmail = input.value;
                    openModal('Subscribed!', `
                <p>Thank you for subscribing to the Brew & Co. newsletter!</p>
                <p style="font-size:0.95rem;">You'll receive brewing tips, new arrivals, and exclusive offers.</p>
                <button class="btn" data-action="close-modal" style="margin-top:0.5rem;">Got it</button>
              `);
                    render();
                }
            }

            function handleContact(e) {
                const name = document.getElementById('contact-name').value;
                if (name) {
                    openModal('Message Sent!', `
                <p>Thanks ${name}, we've received your message.</p>
                <p style="font-size:0.95rem;">Our team will respond within 24 hours.</p>
                <button class="btn" data-action="close-modal" style="margin-top:0.5rem;">Close</button>
              `);
                    e.target.reset();
                }
            }

            function handleCheckout() {
                if (state.cart.length === 0) return;
                if (!state.user) {
                    openModal('Sign In Required', `
                <p>Please sign in or create an account to complete your purchase.</p>
                <button class="btn" data-action="nav" data-param="account" style="margin-top:0.5rem;">Go to Account</button>
                <button class="btn btn-outline" data-action="close-modal" style="margin-top:0.5rem;">Close</button>
              `);
                    return;
                }
                const total = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
                const itemsHtml = state.cart.map(item => {
                    const prod = products.find(p => p.id === item.id);
                    return `<div class="cart-summary-item"><span>${prod ? prod.name : item.id} × ${item.qty}</span><span>${formatPrice(item.price * item.qty)}</span></div>`;
                }).join('');

                // Add order to user
                const orderId = 'ORD-' + String(Math.floor(100 + Math.random() * 900));
                if (state.user) {
                    if (!state.user.orders) state.user.orders = [];
                    state.user.orders.unshift({ id: orderId, date: new Date().toISOString().split('T')[0], status: 'Processing' });
                }

                openModal('Order Confirmed! ✅', `
              <div style="margin-bottom:1rem;">${itemsHtml}</div>
              <div class="cart-summary-total"><span>Total</span><span>${formatPrice(total)}</span></div>
              <p style="font-size:0.9rem;margin-top:0.5rem;">Order #${orderId} has been placed. You'll receive a confirmation email shortly.</p>
              <button class="btn" data-action="close-modal" style="margin-top:1rem;">Continue Shopping</button>
            `);
                state.cart = [];
                render();
            }

            function formatPrice(price) {
                const currency = currencies[currentCurrency] || currencies.GBP;
                const symbol = currency.symbol;
                const rate = currency.rate;
                return symbol + (price * rate).toFixed(2);
            }

            // ─── INIT ────────────────────────────────────────────────────
            render();

        })();
    </script>
</body>
</html>
